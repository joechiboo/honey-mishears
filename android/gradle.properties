org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Kotlin 2.4 的 Build Tools API 在這台 Windows 上會噴
# "Could not close incremental caches ... .tab"（rive_native / speech_to_text /
# shared_preferences_android 三個外掛的 compileReleaseKotlin 都中），
# flutter clean + 砍掉 daemon 重來也一樣，是增量快取本身的問題。
# 關掉增量編譯就不會產生那些 .tab 檔；release build 本來也用不到增量。
kotlin.incremental=false
kotlin.compiler.runViaBuildToolsApi=false
